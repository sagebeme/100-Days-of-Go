# CI: proves the course still works on every push and pull request to main.
# Same checks you can run locally, in the same order.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Real Postgres and Redis, so the Day 55, 56, 62 and 78 tests that skip without them run here.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test the course tools
        run: go test ./tools/...

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phase-6-frontend/package-lock.json

      - name: Install the front-end tools
        working-directory: phase-6-frontend
        run: npm ci

      - name: TypeScript typecheck
        working-directory: phase-6-frontend
        run: npm run typecheck

      - name: Solutions and katas pass, starters fail
        run: go run ./tools/verify -starters

      - name: Day 73 end-to-end test in a real browser
        working-directory: phase-6-frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config day-073-front-end-tests/playwright.config.ts

      - name: Site day list is up to date
        run: go run ./tools/sitedata -check
