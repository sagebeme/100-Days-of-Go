# Publishes the course website to GitHub Pages: the site/ folder and each day's README, the same
# pages netlify.toml and vercel.json serve, and nothing else from the repository.
# Pages must be set to "GitHub Actions" (Settings → Pages → Build and deployment → Source).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a deploy already running finishes before the next starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Put the website together
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Site day list is up to date
        run: go run ./tools/sitedata -check

      - name: Build the site folder
        run: tools/build-pages.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}site/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
